[project]
name = "skillprofile"
version = "0.1.0"
description = "Background skill-profile recompute module backed by SQLite"
requires-python = ">=3.10"

[project.scripts]
skillprofile-worker = "skillprofile.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
